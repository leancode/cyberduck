name: Linux Flatpak

# Started by hand. Builds the application image, wraps it in a Flatpak and runs it. The runtime comes from Flathub,
# which the build of this branch could not reach, so this is the proof that the manifest builds.
on:
  workflow_dispatch:

jobs:
  flatpak:
    name: Build the Flatpak
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 25
          cache: maven
      - name: Install libraries and tools
        run: >-
          sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 update &&
          sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 install -y --no-install-recommends
          xvfb libgtk-3-0t64 libgl1 libxtst6 rpm fakeroot desktop-file-utils flatpak flatpak-builder appstream
      - name: Build the application image
        run: >-
          mvn --no-transfer-progress --batch-mode install
          -DskipTests -DskipITs -DskipSign -Drevision=0
          --also-make --projects i18n,profiles,linux
        env:
          SKIP_SIGN: true
      - name: Check the desktop entry and the metadata
        run: |
          desktop-file-validate setup/flatpak/io.cyberduck.Cyberduck.desktop
          appstreamcli validate --no-net setup/flatpak/io.cyberduck.Cyberduck.metainfo.xml
      - name: Install the runtime
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.gnome.Platform//48 org.gnome.Sdk//48
      - name: Build the Flatpak
        run: flatpak-builder --user --force-clean --repo=repo build-dir setup/flatpak/io.cyberduck.Cyberduck.yml
      - name: Make a bundle and run it
        run: |
          flatpak build-bundle repo io.cyberduck.Cyberduck.flatpak io.cyberduck.Cyberduck
          flatpak install --user -y ./io.cyberduck.Cyberduck.flatpak
          flatpak run io.cyberduck.Cyberduck --version
          mkdir -p /tmp/files && touch /tmp/files/a /tmp/files/b
          xvfb-run -a flatpak run --filesystem=/tmp/files io.cyberduck.Cyberduck --smoke list /tmp/files
      - name: Archive the Flatpak
        uses: actions/upload-artifact@v7
        with:
          path: io.cyberduck.Cyberduck.flatpak
          archive: false
