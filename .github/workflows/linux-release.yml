name: Linux Release
# Builds the packages of the Linux GUI for both architectures and attaches them to a GitHub release.
# - After every successful run of "Linux GUI" on main: a release of that commit, marked as the latest release.
# - A pushed tag such as v9.6.0-linux.1: a pre-release of the commit of the tag.
# - Started by hand: builds and tests the packages and keeps them as artifacts of the run, without a release.
on:
  workflow_run:
    workflows: [ 'Linux GUI' ]
    types: [ completed ]
    branches: [ main ]
  push:
    tags: [ 'v*-linux.*' ]
  workflow_dispatch:

# One at a time, in the order of the pushes
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # The commit that is built: for a finished run of "Linux GUI" the commit of that run
  SOURCE: ${{ github.event.workflow_run.head_sha || github.sha }}
  # A run of a pull request from another repository is not built
  WANTED: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository) }}

jobs:
  check:
    name: The commit passed the tests
    # A run of Linux GUI that failed makes no release, and no run of this workflow either
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Require a green Linux GUI run for this commit
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$WANTED" != "true" ]; then
            echo "Nothing to build for this event"
            echo "wanted=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          passed="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow linux-gui.yml --commit "$SOURCE" --status success --json databaseId --jq length)"
          echo "Successful Linux GUI runs for $SOURCE: $passed"
          test "$passed" -ge 1
          echo "wanted=true" >> "$GITHUB_OUTPUT"
    outputs:
      wanted: ${{ steps.check.outputs.wanted }}

  build:
    name: Build for ${{ matrix.arch }}
    needs: check
    if: needs.check.outputs.wanted == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    # The dependencies of the deb are the library names of the machine it is built on
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE }}
          # The build number is the number of commits
          fetch-depth: 0
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 25
          cache: maven
      - name: Install libraries for JavaFX and the packages
        run: sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 update && sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 install -y --no-install-recommends xvfb libgtk-3-0t64 libgl1 libxtst6 rpm fakeroot desktop-file-utils
      - name: Build the packages
        run: >-
          mvn --no-transfer-progress --batch-mode install
          -DskipTests -DskipITs -DskipSign
          --also-make --projects i18n,profiles,linux
        env:
          SKIP_SIGN: true
      - name: Check the desktop entry of the package
        run: |
          dpkg-deb -x linux/target/release/cyberduck_*.deb package
          desktop-file-validate package/opt/cyberduck/lib/cyberduck-Cyberduck.desktop
      - name: Install the deb with its dependencies and start it
        run: |
          sudo apt-get -o Acquire::Retries=5 install -y ./linux/target/release/cyberduck_*.deb
          cyberduck --version
          mkdir -p /tmp/files && touch /tmp/files/a /tmp/files/b
          xvfb-run -a cyberduck --smoke list /tmp/files
      - name: Archive DEB
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: linux/target/release/*.deb
      - name: Archive RPM
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: linux/target/release/*.rpm

  release:
    name: Publish the release
    needs: build
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: 'cyberduck*'
          merge-multiple: true
          path: packages
      - name: Write the checksums
        working-directory: packages
        run: sha256sum cyberduck* > SHA256SUMS
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # The version is in the name of the package, for example cyberduck_9.6.0.4321_amd64.deb
          version="$(ls packages/cyberduck_*_amd64.deb | sed -E 's/.*cyberduck_(.*)_amd64\.deb/\1/')"
          if [ "$EVENT" = "workflow_run" ]; then
            tag="linux-v$version"
            title="Cyberduck for Linux $version"
            flags="--latest"
          else
            tag="$REF_NAME"
            title="Cyberduck for Linux $REF_NAME"
            flags="--prerelease --verify-tag"
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "The release $tag exists already"
            exit 0
          fi
          cat > notes.md <<NOTES
          Community build of Cyberduck for Linux. It is not an official release of iterate GmbH.
          Built from commit $SOURCE.

          - Debian and Ubuntu 24.04: \`sudo apt install ./cyberduck_*_amd64.deb\` (or \`arm64\`)
          - Fedora and other RPM based systems: \`sudo dnf install ./cyberduck-*.rpm\`
          - Check the download with \`sha256sum -c SHA256SUMS\`

          The changes since the last release are listed below.
          NOTES
          gh release create "$tag" packages/* --repo "$GITHUB_REPOSITORY" --target "$SOURCE" --title "$title" \
            $flags --generate-notes --notes-file notes.md
