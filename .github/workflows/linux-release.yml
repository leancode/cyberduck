name: Linux Release
# Builds the packages of the Linux GUI for both architectures and attaches them to a GitHub release.
# Start it by pushing a tag such as v9.6.0-linux.1. Started by hand it builds and tests the packages and keeps
# them as artifacts of the run, without a release.
on:
  push:
    tags: [ 'v*-linux.*' ]
  workflow_dispatch:

# One release at a time
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: The commit passed the tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Require a green Linux GUI run for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          passed="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow linux-gui.yml --commit "$GITHUB_SHA" --status success --json databaseId --jq length)"
          echo "Successful Linux GUI runs for $GITHUB_SHA: $passed"
          test "$passed" -ge 1

  build:
    name: Build for ${{ matrix.arch }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    # The dependencies of the deb are the library names of the machine it is built on
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          # The build number is the number of commits
          fetch-depth: 0
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 25
          cache: maven
      - name: Install libraries for JavaFX and the packages
        run: sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 update && sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 install -y --no-install-recommends xvfb libgtk-3-0t64 libgl1 libxtst6 rpm fakeroot desktop-file-utils
      - name: Build the packages
        run: >-
          mvn --no-transfer-progress --batch-mode install
          -DskipTests -DskipITs -DskipSign
          --also-make --projects i18n,profiles,linux
        env:
          SKIP_SIGN: true
      - name: Check the desktop entry of the package
        run: |
          dpkg-deb -x linux/target/release/cyberduck_*.deb package
          desktop-file-validate package/opt/cyberduck/lib/cyberduck-Cyberduck.desktop
      - name: Install the deb with its dependencies and start it
        run: |
          sudo apt-get -o Acquire::Retries=5 install -y ./linux/target/release/cyberduck_*.deb
          cyberduck --version
          mkdir -p /tmp/files && touch /tmp/files/a /tmp/files/b
          xvfb-run -a cyberduck --smoke list /tmp/files
      - name: Archive DEB
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: linux/target/release/*.deb
      - name: Archive RPM
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: linux/target/release/*.rpm

  release:
    name: Publish the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: 'cyberduck*'
          merge-multiple: true
          path: packages
      - name: Write the checksums
        working-directory: packages
        run: sha256sum cyberduck* > SHA256SUMS
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cat > notes.md <<NOTES
          Community build of Cyberduck for Linux. It is not an official release of iterate GmbH.

          - Debian and Ubuntu 24.04: \`sudo apt install ./cyberduck_*_amd64.deb\` (or \`arm64\`)
          - Fedora and other RPM based systems: \`sudo dnf install ./cyberduck-*.rpm\`
          - Check the download with \`sha256sum -c SHA256SUMS\`

          The changes since the last release are listed below.
          NOTES
          gh release create "$TAG" packages/* --repo "$GITHUB_REPOSITORY" --title "Cyberduck for Linux $TAG" \
            --prerelease --generate-notes --notes-file notes.md --verify-tag
